syntax = "proto3";

package mangaproto;

option go_package = "mangahub/proto/mangaproto;mangaproto";

service MangaService {
  rpc GetManga (GetMangaRequest) returns (MangaResponse);
  rpc SearchManga (SearchRequest) returns (SearchResponse);
  rpc UpdateProgress (ProgressRequest) returns (ProgressResponse);
  rpc StreamProgress (StreamProgressRequest) returns (stream ProgressResponse);
}

message GetMangaRequest {
  string id = 1;
}

message SearchRequest {
  string query = 1;
  string genre = 2;
  string status = 3;
  int32 limit = 4;
  int32 page = 5;
}

message MangaResponse {
  string id = 1;
  string title = 2;
  string author = 3;
  string artist = 4;
  repeated string genres = 5;
  string status = 6;
  int32 total_chapters = 7;
  string description = 8;
  string cover_url = 9;
  int32 year = 10;
  double rating = 11;
}

message SearchResponse {
  repeated MangaResponse manga = 1;
  int32 total = 2;
}

message ProgressRequest {
  string user_id = 1;
  string manga_id = 2;
  int32 chapter = 3;
  string status = 4;
  int32 rating = 5;
  string notes = 6;
}

message ProgressResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
  string manga_id = 4;
  int32 chapter = 5;
  string status = 6;
  int64 timestamp = 7;
}

message StreamProgressRequest {
  string user_id = 1;
}
